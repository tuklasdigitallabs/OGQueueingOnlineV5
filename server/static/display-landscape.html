<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>QSys Display</title>
  <style>
    :root{
      --gap:10px;
      --brand:#900000;
      --regular:#a40000;
      --priority:#008f4c;
      --panel:#f2e2e2;
      --ink:#050505;
    }
    *{box-sizing:border-box;user-select:none}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{font-family:Arial,Helvetica,sans-serif;background:var(--brand);color:var(--ink)}
    .shell{height:100%;padding:12px;display:grid;grid-template-rows:48px minmax(0,1fr);gap:var(--gap)}
    .topbar{display:flex;align-items:center;justify-content:space-between;color:#fff;padding:0 10px}
    #nowServingHeader{margin:0;font-size:clamp(20px,2vw,34px);font-weight:900;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kioskTools{display:flex;gap:7px}
    .kioskTools button{border:1px solid rgba(255,255,255,.22);border-radius:10px;background:rgba(80,0,0,.4);color:#fff;padding:7px 11px;font-weight:700}
    .layout{min-height:0;display:grid;grid-template-columns:30% 35.5% 34.5%;gap:var(--gap)}
    .left{min-height:0;display:grid;grid-template-rows:45% 55%;gap:var(--gap)}
    .card{background:var(--panel);border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.45)}
    .servingCard{padding:14px;display:flex;flex-direction:column}
    .servingTitle{text-align:center;font-size:clamp(30px,3.3vw,56px);font-weight:950;letter-spacing:.08em}
    #globalServing{flex:1;margin-top:12px;border-radius:14px;background:#a83a3a;color:#fff;display:grid;place-items:center;font-size:clamp(70px,9vw,170px);font-weight:950;letter-spacing:.04em}
    #globalServing.priority{background:var(--priority)}
    .pulse{animation:pulse .75s ease}
    @keyframes pulse{50%{transform:scale(1.025);filter:brightness(1.2)}}
    .qrCard{padding:12px;display:grid;grid-template-columns:42% 58%;align-items:center}
    .qrCopy{display:flex;align-items:center;gap:10px;padding:10px}
    .step{font-size:clamp(60px,7vw,120px);font-weight:950}
    .instruction{font-size:clamp(18px,2.2vw,38px);font-weight:900;line-height:1.05}
    #guestQr{width:100%;height:100%;object-fit:contain;background:#fff;border-radius:12px;padding:8px}
    .groups{min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:var(--gap)}
    .groupCard{padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr)}
    .groupHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
    .groupName{font-size:clamp(22px,2.3vw,42px);font-weight:950}
    .hidden{text-align:right;font-size:clamp(14px,1.25vw,23px);font-weight:900;line-height:1.05}
    .hidden:before{content:"WAITING";display:block;font-size:.7em}
    .columns{min-height:0;margin-top:8px;display:grid;grid-template-columns:40% 60%;gap:8px}
    .queueColumn{min-height:0;border-radius:12px;padding:6px;border:2px solid rgba(0,0,0,.15);overflow:hidden}
    .queueColumn.priority{border-color:rgba(0,143,76,.55);background:rgba(0,143,76,.06)}
    .queueColumn.regular{border-color:rgba(164,0,0,.35);background:rgba(164,0,0,.06)}
    .columnTitle{text-align:center;font-size:clamp(17px,1.55vw,28px);font-weight:950}
    .queueCodes{display:grid;align-content:start;grid-auto-rows:min-content;gap:0}
    .regular .queueCodes{grid-template-columns:1fr 1fr}
    .queueCode{text-align:center;font-size:clamp(24px,2.4vw,46px);font-weight:950;line-height:1.05;color:var(--regular)}
    .priority .queueCode{color:var(--priority)}
    .videoCard{position:relative;background:#130b08}
    .videoCard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}
    .videoCard video.isActive{opacity:1}
    body.mode-grid .layout{grid-template-columns:38% 62%}
    body.mode-grid .videoCard{display:none}
    body.mode-grid .queueCode{font-size:clamp(28px,3vw,58px)}
    #status{position:fixed;left:8px;bottom:3px;color:rgba(255,255,255,.55);font-size:10px}
    #settingsPanel{display:none}
  </style>
</head>
<body class="mode-video orient-landscape">
  <main class="shell">
    <header class="topbar">
      <h1 id="nowServingHeader">Branch</h1>
      <div class="kioskTools">
        <button id="btnMove" type="button">Move</button>
        <button id="btnFull" type="button">Fullscreen</button>
        <button id="btnClose" type="button">Close</button>
      </div>
    </header>
    <section class="layout">
      <div class="left">
        <article class="card servingCard">
          <div class="servingTitle">NOW SERVING</div>
          <div id="globalServing">—</div>
        </article>
        <article class="card qrCard">
          <div class="qrCopy"><span class="step">1</span><span class="instruction">Scan to<br>join queue</span></div>
          <img id="guestQr" alt="Guest queue QR code" />
        </article>
      </div>
      <section class="groups">
        <article class="card groupCard">
          <div class="groupHeader"><div class="groupName">1–2 PAX</div><div class="hidden" id="hidden-A">P: 0 | R: 0</div></div>
          <div class="columns"><div class="queueColumn priority"><div class="columnTitle">PRIORITY</div><div class="queueCodes" id="priority-A"></div></div><div class="queueColumn regular"><div class="columnTitle">REGULAR</div><div class="queueCodes" id="regular-A"></div></div></div>
        </article>
        <article class="card groupCard">
          <div class="groupHeader"><div class="groupName">3–5 PAX</div><div class="hidden" id="hidden-B">P: 0 | R: 0</div></div>
          <div class="columns"><div class="queueColumn priority"><div class="columnTitle">PRIORITY</div><div class="queueCodes" id="priority-B"></div></div><div class="queueColumn regular"><div class="columnTitle">REGULAR</div><div class="queueCodes" id="regular-B"></div></div></div>
        </article>
        <article class="card groupCard">
          <div class="groupHeader"><div class="groupName">6++ PAX</div><div class="hidden" id="hidden-C">P: 0 | R: 0</div></div>
          <div class="columns"><div class="queueColumn priority"><div class="columnTitle">PRIORITY</div><div class="queueCodes" id="priority-C"></div></div><div class="queueColumn regular"><div class="columnTitle">REGULAR</div><div class="queueCodes" id="regular-C"></div></div></div>
        </article>
      </section>
      <article class="card videoCard">
        <video id="adPlayerA" class="isActive" autoplay playsinline preload="auto"></video>
        <video id="adPlayerB" autoplay playsinline preload="auto"></video>
      </article>
    </section>
  </main>
  <div id="settingsPanel"></div>
  <div id="status">Connecting…</div>
  <audio id="chime" preload="auto"></audio>
  <script src="./app-boot.js"></script>
  <script>
    document.getElementById("chime").src = window.appUrl("/static/chime.mp3");
    document.write('<script src="' + window.appUrl('/socket.io/socket.io.js') + '"><\/script>');
    document.write('<script src="' + window.appUrl('/static/js/display-ui-landscape.js?v=20260623') + '"><\/script>');
    document.write('<script src="' + window.appUrl('/static/js/display-core.js?v=20260623') + '"><\/script>');
  </script>
</body>
</html>
