<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>QSys Portrait Display</title>
  <style>
    :root{--gap:12px;--brand:#900000;--regular:#a40000;--priority:#008f4c;--panel:#f2e2e2;--ink:#050505}
    *{box-sizing:border-box;user-select:none}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{font-family:Arial,Helvetica,sans-serif;background:var(--brand);color:var(--ink)}
    .shell{height:100%;padding:12px;display:grid;grid-template-rows:64px minmax(0,1fr);gap:var(--gap)}
    .topbar{background:#c47f7f;border-radius:28px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    #nowServingHeader{font-size:clamp(22px,3vw,38px);font-weight:950;letter-spacing:.08em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .kioskTools{display:flex;gap:8px}.kioskTools button{border:1px solid rgba(0,0,0,.14);border-radius:16px;background:rgba(255,255,255,.32);padding:9px 13px;font-weight:900}
    .layout{min-height:0;display:grid;grid-template-columns:53% 47%;gap:var(--gap)}
    .left{min-height:0;display:grid;grid-template-rows:30% 45% 25%;gap:var(--gap)}
    .card{background:var(--panel);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.45)}
    .servingCard{padding:14px;display:flex;flex-direction:column}
    .servingTitle{text-align:center;font-size:clamp(34px,5vw,64px);font-weight:950;letter-spacing:.08em}
    #globalServing{flex:1;margin-top:12px;border-radius:14px;background:var(--regular);color:#fff;display:grid;place-items:center;font-size:clamp(90px,16vw,190px);font-weight:950}
    #globalServing.priority{background:var(--priority)}
    .pulse{animation:pulse .75s ease}@keyframes pulse{50%{transform:scale(1.025);filter:brightness(1.2)}}
    .videoCard{position:relative;background:#130b08}.videoCard video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
    .qrCard{min-height:0;padding:10px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:6px}
    .qrCopy{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 6px}
    .step{font-size:clamp(24px,3.8vw,44px);font-weight:950}
    .instruction{font-size:clamp(18px,2.8vw,34px);font-weight:950;line-height:1;white-space:nowrap}
    #guestQr{display:block;width:100%;height:100%;min-height:0;object-fit:contain;background:#fff;border-radius:12px;padding:4px}
    .groups{min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:var(--gap)}
    .groupCard{padding:12px;display:grid;grid-template-rows:auto minmax(0,1fr)}
    .groupHeader{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.groupName{font-size:clamp(22px,3.5vw,42px);font-weight:950}
    .hidden{text-align:right;font-size:clamp(14px,2vw,24px);font-weight:900;line-height:1.05}.hidden:before{content:"WAITING";display:block;font-size:.7em}
    .columns{min-height:0;margin-top:10px;display:grid;grid-template-columns:48% 52%;gap:8px}
    .queueColumn{min-height:0;border-radius:14px;padding:7px;border:2px solid rgba(0,0,0,.15);overflow:hidden}
    .queueColumn.priority{border-color:rgba(0,143,76,.55);background:rgba(0,143,76,.06)}.queueColumn.regular{border-color:rgba(164,0,0,.35);background:rgba(164,0,0,.06)}
    .columnTitle{text-align:center;font-size:clamp(20px,3vw,34px);font-weight:950}
    .queueCodes{display:grid;align-content:start;grid-auto-rows:min-content}.regular .queueCodes{grid-template-columns:1fr 1fr}
    .queueCode{text-align:center;font-size:clamp(24px,3.7vw,46px);font-weight:950;line-height:1.08;color:var(--regular)}.priority .queueCode{color:var(--priority)}
    body.mode-grid .left{grid-template-rows:70% 30%}body.mode-grid .videoCard{display:none}
    #status{position:fixed;left:8px;bottom:3px;color:rgba(255,255,255,.55);font-size:10px}#settingsPanel{display:none}
  </style>
</head>
<body class="mode-video orient-portrait">
  <main class="shell">
    <header class="topbar">
      <div id="nowServingHeader">Branch</div>
      <div class="kioskTools"><button id="btnMove" type="button">Move</button><button id="btnFull" type="button">Fullscreen</button><button id="btnClose" type="button">Close</button></div>
    </header>
    <section class="layout">
      <div class="left">
        <article class="card servingCard"><div class="servingTitle">NOW SERVING</div><div id="globalServing">—</div></article>
        <article class="card videoCard"><video id="adPlayer" autoplay playsinline preload="auto"></video></article>
        <article class="card qrCard"><div class="qrCopy"><span class="step">1</span><span class="instruction">SCAN TO JOIN QUEUE</span></div><img id="guestQr" alt="Guest queue QR code" /></article>
      </div>
      <section class="groups">
        <article class="card groupCard"><div class="groupHeader"><div class="groupName">1–2 PAX</div><div class="hidden" id="hidden-A">P: 0 | R: 0</div></div><div class="columns"><div class="queueColumn priority"><div class="columnTitle">PRIORITY</div><div class="queueCodes" id="priority-A"></div></div><div class="queueColumn regular"><div class="columnTitle">REGULAR</div><div class="queueCodes" id="regular-A"></div></div></div></article>
        <article class="card groupCard"><div class="groupHeader"><div class="groupName">3–5 PAX</div><div class="hidden" id="hidden-B">P: 0 | R: 0</div></div><div class="columns"><div class="queueColumn priority"><div class="columnTitle">PRIORITY</div><div class="queueCodes" id="priority-B"></div></div><div class="queueColumn regular"><div class="columnTitle">REGULAR</div><div class="queueCodes" id="regular-B"></div></div></div></article>
        <article class="card groupCard"><div class="groupHeader"><div class="groupName">6++ PAX</div><div class="hidden" id="hidden-C">P: 0 | R: 0</div></div><div class="columns"><div class="queueColumn priority"><div class="columnTitle">PRIORITY</div><div class="queueCodes" id="priority-C"></div></div><div class="queueColumn regular"><div class="columnTitle">REGULAR</div><div class="queueCodes" id="regular-C"></div></div></div></article>
      </section>
    </section>
  </main>
  <div id="settingsPanel"></div><div id="status">Connecting…</div><audio id="chime" preload="auto"></audio>
  <script src="./app-boot.js"></script>
  <script>
    document.getElementById("chime").src = window.appUrl("/static/chime.mp3");
    document.write('<script src="' + window.appUrl('/socket.io/socket.io.js') + '"><\/script>');
    document.write('<script src="' + window.appUrl('/static/js/display-ui-portrait.js?v=20260623') + '"><\/script>');
    document.write('<script src="' + window.appUrl('/static/js/display-core.js?v=20260623') + '"><\/script>');
  </script>
</body>
</html>
